<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LiverySave" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>LiverySave</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div id="app">
    <header class="top">
      <div class="topbar">
        <div class="title-wrap">
          <h1>LiverySave</h1>
          <p id="countLabel" class="count-label">No liveries yet</p>
        </div>
        <div class="top-actions">
        <button id="planesBtn" class="flights-btn" type="button" aria-label="My planes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
        </button>
        <button id="flightsBtn" class="flights-btn" type="button" aria-label="Saved flights">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
          <span id="flightsBadge" class="flights-badge hidden">0</span>
        </button>
      </div>
      </div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" class="search-icon" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input id="searchInput" type="search" placeholder="Search reg, operator, livery..." autocomplete="off" />
      </div>
      <div id="chips" class="chips"></div>
    </header>
    <main id="board" class="board"></main>
    <button id="fab" class="fab" type="button" aria-label="Add livery">&#43;</button>
    <button id="surpriseBtn" class="fab-surprise" type="button" aria-label="Surprise me">&#127922;</button>
  </div>

  <div id="backdrop" class="backdrop"></div>

  <section id="addSheet" class="sheet add-sheet" aria-hidden="true">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2 id="addTitle">Add livery</h2>
      <button class="btn-close" data-close type="button" aria-label="Close">&#10005;</button>
    </div>
    <div class="sheet-body">

      <div id="addStepInput" class="step">
        <label class="field-label" for="regInput">Aircraft registration</label>
        <input id="regInput" class="field-input reg-input" type="text" placeholder="e.g. G-STBC" autocomplete="off" spellcheck="false" />
        <p class="hint">The tail number you saw in the sim. Any format works: N12345, G-STBC, D-AIZY...</p>
        <button id="lookupBtn" class="btn primary" type="button">Find aircraft</button>
      </div>

      <div id="addStepLoading" class="step hidden">
        <div class="spinner"></div>
        <p id="lookupStatus" class="loading-text">Looking up…</p>
      </div>

      <div id="addStepError" class="step hidden">
        <div class="error-icon-wrap">
          <svg viewBox="0 0 24 24" class="error-icon" aria-hidden="true"><path fill="currentColor" d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        </div>
        <p id="lookupError" class="error-text"></p>
        <div class="error-actions">
          <button id="retryBtn" class="btn secondary" type="button">Try again</button>
          <button id="manualBtn" class="btn secondary" type="button">Add manually</button>
        </div>
      </div>

      <form id="addForm" class="step hidden" autocomplete="off">
        <div id="previewCard" class="preview-card hidden"></div>
        <div class="field">
          <label class="field-label" for="fReg">Registration</label>
          <input id="fReg" class="field-input" type="text" required />
        </div>
        <div class="field">
          <label class="field-label" for="fOperator">Operator / airline</label>
          <input id="fOperator" class="field-input" type="text" />
        </div>
        <div class="field">
          <label class="field-label" for="fType">Aircraft type</label>
          <input id="fType" class="field-input" type="text" />
        </div>
        <div class="field">
          <label class="field-label" for="fLivery">Livery name <span class="opt">(optional)</span></label>
          <input id="fLivery" class="field-input" type="text" placeholder="e.g. Retro, OneWorld, special..." />
        </div>
        <div class="field">
          <label class="field-label" for="fNotes">Notes <span class="opt">(optional)</span></label>
          <textarea id="fNotes" class="field-input textarea" rows="2" placeholder="Anything worth remembering..."></textarea>
        </div>
        <div class="field">
          <label class="field-label" for="fUrl">flightsim.to link <span class="opt">(optional)</span></label>
          <input id="fUrl" class="field-input" type="url" placeholder="https://flightsim.to/addon/..." />
        </div>
        <button id="saveBtn" class="btn primary" type="submit">Save to board</button>
      </form>

    </div>
  </section>

  <section id="detailSheet" class="sheet detail-sheet" aria-hidden="true">
    <div class="detail-scroll">
      <div class="detail-img-wrap">
        <img id="dImg" class="detail-img" alt="" />
        <button class="btn-close detail-close" data-close type="button" aria-label="Close">&#10005;</button>
      </div>
      <div id="detailBody" class="detail-body"></div>
    </div>
  </section>

  <section id="flightsSheet" class="sheet flights-sheet" aria-hidden="true">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2>Saved flights</h2>
      <button class="btn-close" data-close type="button" aria-label="Close">&#10005;</button>
    </div>
    <div class="sheet-body">
      <div class="flights-list" id="flightsList"></div>
      <div class="route-map-wrap hidden" id="flightsMapWrap"><div id="flightsMap"></div></div>
    </div>
  </section>

  <section id="planesSheet" class="sheet flights-sheet" aria-hidden="true">
    <div class="sheet-grabber"></div>
    <div class="sheet-head">
      <h2>My planes</h2>
      <button class="btn-close" data-close type="button" aria-label="Close">&#10005;</button>
    </div>
    <div class="sheet-body">
      <form id="planeForm" class="plane-form" autocomplete="off">
        <div class="field">
          <label class="field-label" for="pName">Addon name</label>
          <input id="pName" class="field-input" type="text" placeholder="e.g. PMDG B777" required />
          <p class="hint">Include the aircraft type if you can (e.g. PMDG B773). It\u2019s used to match liveries and feed the flightsim.to search.</p>
        </div>
        <button id="addPlaneBtn" class="btn primary" type="submit">Add plane</button>
      </form>
      <div class="planes-list" id="planesList"></div>
    </div>
  </section>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/aircraftTypes.js"></script>
  <script src="js/db.js"></script>
  <script src="js/liveryApi.js"></script>
  <script src="js/store.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
